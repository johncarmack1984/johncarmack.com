    <!-- Structured data (WebSite + ProfilePage + Person + the project list as
         SoftwareSourceCode/SoftwareApplication nodes) is generated at build time
         by prerender.mjs from src/lib/structured-data.ts, so it never drifts from
         the rendered cards. The marker below is replaced in dist/index.html. -->
    <!--structured-data-->

    <!-- Self-hosted Inter Variable (see @font-face in globals.css). Deliberately
         not preloaded: font-display:optional already guarantees no swap/shift, so
         the LCP hero image keeps bandwidth priority. Inter loads at normal priority
         and is cached for subsequent paints. -->


    <!-- Set the theme before first paint to avoid a flash (mirrors next-themes). -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.setAttribute("data-theme", "dark");
        } catch {}
      })();
    </script>

  <body class="min-h-screen font-sans antialiased">

    <script type="module" src="/src/main.tsx"></script>
  </body>
